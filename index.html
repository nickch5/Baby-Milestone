<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby Milestone Book</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F3F3;
    --card:#FFFFFF;
    --ink:#3A332C;
    --ink-soft:#7A7167;
    --sage:#8A9A7E;
    --sage-deep:#5C6B52;
    --clay:#E3A472;
    --rose:#D98C93;
    --gold:#B98B2E;
    --line: rgba(58,51,44,0.16);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(58,51,44,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding: 0 0 80px;
  }

  .wrap{
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 20px 0;
  }

  /* ---------- Cover ---------- */
  .cover{
    text-align:center;
    padding: 20px 10px 56px;
    border-bottom: 1px dashed var(--line);
    margin-bottom: 40px;
  }
  .eyebrow{
    font-size: 13px;
    letter-spacing: 0.28em;
    color: var(--sage-deep);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(32px, 6vw, 48px);
    margin: 0 0 18px;
    line-height: 1.25;
    font-style: italic;
  }
  .cover-fields{
    display:flex;
    gap: 28px;
    justify-content:center;
    flex-wrap:wrap;
    font-size: 15px;
    color: var(--ink-soft);
  }
  .cover-fields .field{ text-align:left; }
  .cover-fields label{
    display:block;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--sage-deep);
    margin-bottom:4px;
  }
  [contenteditable]{
    outline: none;
    border-bottom: 1px solid transparent;
    transition: border-color .2s ease;
  }
  [contenteditable]:hover, [contenteditable]:focus{
    border-bottom-color: var(--clay);
  }
  [contenteditable]:empty:before{
    content: attr(data-placeholder);
    color: var(--ink-soft);
    opacity: .65;
  }
  .cover-fields .value{
    font-family:'Fraunces', serif;
    font-size: 17px;
    color: var(--ink);
    min-width: 120px;
  }
  input[type=date]{
    font-family:'Fraunces', serif;
    font-size: 17px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    outline: none;
    padding: 0;
    transition: border-color .2s ease;
  }
  input[type=date]:hover, input[type=date]:focus{ border-bottom-color: var(--clay); }

  /* ---------- Timeline ---------- */
  .timeline{
    position: relative;
    padding-left: 34px;
  }
  .timeline::before{
    content:"";
    position:absolute;
    left: 11px;
    top: 6px;
    bottom: 6px;
    width: 2px;
    background: repeating-linear-gradient(
      to bottom, var(--sage) 0 6px, transparent 6px 12px
    );
  }

  .milestone{
    position: relative;
    background: var(--card);
    border-radius: 14px;
    padding: 20px 20px 18px 22px;
    margin-bottom: 22px;
    box-shadow: 0 1px 0 rgba(58,51,44,0.04);
    border: 1px solid var(--line);
  }
  .milestone::before{
    /* stamp node on the ribbon */
    content:"";
    position:absolute;
    left: -34px;
    top: 22px;
    width: 24px;
    height: 24px;
    background: var(--paper);
    border: 2px solid var(--sage);
    border-radius: 50%;
  }
  .m-head{
    display:flex;
    align-items:flex-start;
    gap: 14px;
  }
  .m-icon-wrap{
    position: relative;
    flex: 0 0 auto;
  }
  .m-icon{
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--paper);
    display:flex; align-items:center; justify-content:center;
    color: var(--sage-deep);
    border: 1px solid transparent;
    cursor: pointer;
    padding: 0;
    transition: border-color .2s ease, background .2s ease;
  }
  .m-icon:hover{ border-color: var(--clay); }
  .m-icon svg{ width:22px; height:22px; }

  .icon-menu{
    display:none;
    position:absolute;
    top: 46px;
    left: 0;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
    box-shadow: 0 8px 24px rgba(0,0,0,.14);
    z-index: 20;
  }
  .icon-menu.open{ display:grid; }
  .icon-menu button{
    width: 32px; height: 32px;
    border: none;
    background: transparent;
    border-radius: 7px;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-soft);
  }
  .icon-menu button svg{ width:18px; height:18px; }
  .icon-menu button:hover{ background: var(--paper); color: var(--sage-deep); }
  .icon-menu button.active{ background: var(--sage); color: #fff; }
  .m-title{
    flex: 1 1 auto;
    min-width: 0;
  }
  .m-title .name{
    font-family:'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    margin: 0 0 2px;
  }
  .m-title .avg{
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .m-delete{
    flex: 0 0 auto;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size: 15px;
    line-height: 1;
    transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .m-delete:hover{ background: var(--rose); color:#fff; border-color: var(--rose); }

  .m-body{
    margin-top: 14px;
    display:flex;
    gap: 22px;
    flex-wrap:wrap;
    align-items:flex-end;
  }
  .m-field{ min-width: 130px; }
  .m-field label{
    display:block;
    font-size: 11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color: var(--rose);
    margin-bottom: 4px;
  }
  .m-field .val{
    font-size: 15px;
  }
  .m-age .val{
    color: var(--sage-deep);
    font-weight: 500;
  }

  /* ---------- Add milestone ---------- */
  .add-row{
    display:flex;
    justify-content:center;
    margin-top: 8px;
  }
  .add-btn{
    font-family:'Inter', sans-serif;
    font-size: 14px;
    color: var(--sage-deep);
    background: transparent;
    border: 1.5px dashed var(--sage);
    border-radius: 999px;
    padding: 9px 20px;
    cursor:pointer;
    transition: background .2s ease, color .2s ease;
  }
  .add-btn:hover{ background: var(--sage); color:#fff; }

  input[type=file]{ display:none; }

  /* ---------- Sync panel ---------- */
  .sync-wrap{ max-width: 620px; margin: 0 auto 36px; }
  details.sync summary{
    cursor:pointer; font-size: 13px; color: var(--sage-deep); list-style:none;
    display:flex; align-items:center; gap:6px; padding: 4px 2px;
  }
  details.sync summary::-webkit-details-marker{ display:none; }
  details.sync .inner{
    margin-top: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 20px;
  }
  .sync-field label{
    display:block; font-size: 11px; letter-spacing:.06em; text-transform:uppercase;
    color: var(--rose); margin-bottom: 5px;
  }
  input[type=text].sync-input{
    width: 100%;
    font-family:'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    outline: none;
  }
  input[type=text].sync-input:focus{ border-color: var(--clay); }
  .sync-btn-row{ margin-top: 12px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .sync-btn{
    font-family:'Inter', sans-serif;
    font-size: 13.5px;
    border: none;
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
  }
  .sync-btn-primary{ background: var(--sage-deep); color:#fff; }
  .sync-status{ font-size: 12.5px; color: var(--ink-soft); }
  .sync-status.ok{ color: var(--sage-deep); }
  .sync-status.err{ color: var(--rose); }
  .sync-hint{ font-size: 12.5px; color: var(--ink-soft); line-height:1.6; margin-top:10px; }

</style>
</head>
<body>

<div class="wrap">
  <div class="cover">
    <div class="eyebrow">Baby Milestone Book</div>
    <h1>Milestones of <span id="babyNameSpan" contenteditable="true" data-placeholder="baby's name">our little one</span></h1>

    <div class="cover-fields">
      <div class="field">
        <label>Nickname</label>
        <div class="value" id="nicknameDiv" contenteditable="true" data-placeholder="Type nickname">Baby...</div>
      </div>
      <div class="field">
        <label>Date of birth</label>
        <input type="date" id="dob">
      </div>
    </div>
  </div>

  <div class="sync-wrap">
    <details class="sync" id="syncDetails">
      <summary id="syncSummary">⚙ Connect to Google Sheets (one-time setup)</summary>
      <div class="inner">
        <div class="sync-field">
          <label>Web App URL</label>
          <input type="text" class="sync-input" id="sheetUrl" placeholder="https://script.google.com/macros/s/AKfycb.../exec">
        </div>
        <div class="sync-btn-row">
          <button class="sync-btn sync-btn-primary" id="connectSheetBtn" type="button">Connect</button>
          <span class="sync-status" id="syncStatus"></span>
        </div>
        <p class="sync-hint" id="syncHint">Paste your Google Apps Script Web App URL and tap Connect. Names, dates, and ages will sync across devices — photos stay local to each device only (they're too large for a spreadsheet cell).</p>
      </div>
    </details>
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="add-row">
    <button class="add-btn" id="addMilestoneBtn">+ Add a milestone</button>
  </div>
</div>

<script>
// ---- icon set (simple line icons) ----
const icons = {
  smile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8.5" cy="9" r="1"/><circle cx="15.5" cy="9" r="1"/><path d="M7 14c1.2 2 3 3 5 3s3.8-1 5-3"/></svg>`,
  laugh: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 8l2 2M6 10l2-2"/><path d="M16 8l2 2M16 10l2-2"/><path d="M6.5 13.5c1.5 3 3.4 4.5 5.5 4.5s4-1.5 5.5-4.5"/></svg>`,
  roll: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12a7 7 0 1 1 2 4.9"/><path d="M5 17v-4h4"/></svg>`,
  sit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="6.5" r="2.2"/><path d="M8 20v-4c0-2 1.8-3.5 4-3.5s4 1.5 4 3.5v4"/></svg>`,
  tooth: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4c-2.2 0-3.5 1.8-3.3 4.4.2 2.6 1 6.5 1.9 8.7.5 1.3 1.9 1.2 2.2-.1.4-1.6.9-3 1.2-3s.8 1.4 1.2 3c.3 1.3 1.7 1.4 2.2.1.9-2.2 1.7-6.1 1.9-8.7C15.5 5.8 14.2 4 12 4c-1 0-1.4.6-2 .6S9 4 8 4Z"/></svg>`,
  crawl: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="7" r="1.3"/><circle cx="13" cy="9" r="1.3"/><circle cx="8" cy="15" r="1.3"/><circle cx="16" cy="16" r="1.3"/></svg>`,
  stand: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="5.5" r="2"/><path d="M12 8v7"/><path d="M12 15l-3 5M12 15l3 5"/><path d="M9 11h6"/></svg>`,
  walk: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><ellipse cx="9" cy="8" rx="2" ry="2.6"/><ellipse cx="15" cy="16" rx="2" ry="2.6"/></svg>`,
  word: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v9H9l-3 3v-3H4z"/><circle cx="9" cy="10.5" r=".6" fill="currentColor" stroke="none"/><circle cx="12" cy="10.5" r=".6" fill="currentColor" stroke="none"/><circle cx="15" cy="10.5" r=".6" fill="currentColor" stroke="none"/></svg>`,
  cake: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3"/><path d="M11 3.6c0 .8.6 1 .6 1.7s-.6.9-.6 1.7"/><path d="M5 20v-6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v6"/><path d="M4 20h16"/><path d="M5 14c1-1 2-1 3 0s2 1 3 0 2-1 3 0 2 1 3 0"/></svg>`,
  flag: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 4.5c1.6-1 3.2-1 4.8 0s3.2 1 4.8 0v8c-1.6 1-3.2 1-4.8 0s-3.2-1-4.8 0"/></svg>`,
  foot: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><ellipse cx="9" cy="8" rx="2" ry="2.6"/><ellipse cx="15" cy="16" rx="2" ry="2.6"/></svg>`,
  hand: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12V6a1.3 1.3 0 0 1 2.6 0v5"/><path d="M10.6 11V5a1.3 1.3 0 0 1 2.6 0v6"/><path d="M13.2 11V6a1.3 1.3 0 0 1 2.6 0v6"/><path d="M15.8 12v-3a1.2 1.2 0 0 1 2.4 0v6c0 3-2 5.5-5 5.5s-4.6-1.2-5.7-3L6 14.5c-.5-.9-.2-1.8.6-2.2.7-.4 1.5-.1 2 .6l.6 1"/></svg>`,
  babyface: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"/><path d="M12 6c-.6-1.4.2-2.6 1.6-3"/><circle cx="9.3" cy="12.3" r=".8" fill="currentColor" stroke="none"/><circle cx="14.7" cy="12.3" r=".8" fill="currentColor" stroke="none"/><path d="M9.5 16c.8.7 1.6 1 2.5 1s1.7-.3 2.5-1"/></svg>`,
  camera: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>`
};

const timeline = document.getElementById('timeline');
const dobInput = document.getElementById('dob');
const babyNameSpan = document.getElementById('babyNameSpan');
const nicknameDiv = document.getElementById('nicknameDiv');

// ---- persistence (localStorage) ----
const STORAGE_KEY = 'babyMilestoneBook';

function collectData(){
  const milestones = Array.from(document.querySelectorAll('.milestone')).map(el => {
    return {
      icon: el.dataset.icon || 'flag',
      name: el.querySelector('.name').textContent,
      avg: el.querySelector('.avg').textContent,
      date: el.querySelector('.m-date-input').value
    };
  });
  return {
    babyName: babyNameSpan.textContent,
    nickname: nicknameDiv.textContent,
    dob: dobInput.value,
    milestones
  };
}

function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(collectData()));
    if(typeof debouncedSyncPush === 'function') debouncedSyncPush();
  }catch(err){
    console.warn('Could not save (storage may be blocked or full):', err);
    showSaveWarning('Could not save — storage may be full.');
  }
}

function showSaveWarning(msg){
  let el = document.getElementById('saveWarning');
  if(!el){
    el = document.createElement('div');
    el.id = 'saveWarning';
    el.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#3A332C;color:#fff;padding:10px 18px;border-radius:8px;font-family:Inter,sans-serif;font-size:13px;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:82vw;text-align:center;line-height:1.4;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 4500);
}

// resizes/compresses an uploaded image file before we ever try to store it,
// so photos don't blow past the localStorage quota
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(err){
    console.warn('Could not load saved data:', err);
    return null;
  }
}

function debounce(fn, wait){
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), wait);
  };
}
const debouncedSave = debounce(saveData, 400);

// ---- Google Sheets sync (text fields only — photos stay local) ----
const SYNC_STORAGE_KEY = 'babyMilestoneBookSheetUrl';
const sheetUrlInput = document.getElementById('sheetUrl');
const syncStatus = document.getElementById('syncStatus');
const syncDetails = document.getElementById('syncDetails');
const syncSummary = document.getElementById('syncSummary');
const syncHint = document.getElementById('syncHint');
const connectSheetBtn = document.getElementById('connectSheetBtn');

let sheetUrl = localStorage.getItem(SYNC_STORAGE_KEY) || '';
sheetUrlInput.value = sheetUrl;

function persistSheetUrl(){
  const v = sheetUrlInput.value.trim();
  if(v && v !== sheetUrl){
    sheetUrl = v;
    localStorage.setItem(SYNC_STORAGE_KEY, sheetUrl);
  }
  return sheetUrl;
}
sheetUrlInput.addEventListener('input', persistSheetUrl);
sheetUrlInput.addEventListener('change', persistSheetUrl);

function setSyncConnectedUI(connected){
  if(connected){
    syncDetails.open = false;
    syncSummary.textContent = '⚙ Sync settings';
    syncHint.textContent = 'Connected — names, dates, and ages sync across devices automatically. Photos stay local to each device.';
    connectSheetBtn.textContent = 'Update connection';
  } else {
    syncDetails.open = true;
    syncSummary.textContent = '⚙ Connect to Google Sheets (one-time setup)';
    syncHint.textContent = 'Paste your Google Apps Script Web App URL and tap Connect. Names, dates, and ages will sync across devices — photos stay local to each device only (they\'re too large for a spreadsheet cell).';
    connectSheetBtn.textContent = 'Connect';
  }
}

function collectSyncData(){
  const full = collectData();
  return {
    babyName: full.babyName,
    nickname: full.nickname,
    dob: full.dob,
    milestones: full.milestones.map(m => ({ icon: m.icon, name: m.name, avg: m.avg, date: m.date }))
  };
}

function pushToSheet(){
  const url = persistSheetUrl();
  if(!url) return Promise.resolve(false);
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(collectSyncData())
  }).then(() => true).catch(err => {
    console.warn('Sheet sync failed:', err);
    return false;
  });
}
const debouncedSyncPush = debounce(pushToSheet, 800);

function pullFromSheet(){
  const url = persistSheetUrl();
  if(!url) return Promise.resolve(null);
  return fetch(url).then(res => res.json()).catch(err => {
    console.warn('Sheet pull failed:', err);
    return null;
  });
}

function applyRemoteData(remote){
  if(!remote) return;
  if(remote.babyName) babyNameSpan.textContent = remote.babyName;
  if(remote.nickname) nicknameDiv.textContent = remote.nickname;
  if(remote.dob) dobInput.value = remote.dob;

  if(Array.isArray(remote.milestones) && remote.milestones.length){
    timeline.innerHTML = '';
    remote.milestones.forEach(item => timeline.appendChild(makeMilestone(item)));
  }
  refreshAllAges();
  saveData();
}

connectSheetBtn.addEventListener('click', () => {
  const url = persistSheetUrl();
  if(!url){ syncStatus.textContent = 'Paste a Web App URL first.'; syncStatus.className = 'sync-status err'; return; }
  syncStatus.textContent = 'Connecting…'; syncStatus.className = 'sync-status';
  pullFromSheet().then(remote => {
    if(remote){
      applyRemoteData(remote);
      setSyncConnectedUI(true);
      syncStatus.textContent = 'Connected ✓'; syncStatus.className = 'sync-status ok';
      pushToSheet();
    } else {
      syncStatus.textContent = 'Could not connect — check the URL and deployment settings.';
      syncStatus.className = 'sync-status err';
    }
  });
});

// ---- age calculation ----
function calcAge(dobStr, eventStr){
  if(!dobStr || !eventStr) return '';
  const dob = new Date(dobStr);
  const ev = new Date(eventStr);
  if(isNaN(dob) || isNaN(ev)) return '';
  if(ev < dob) return 'before birth';

  let years = ev.getFullYear() - dob.getFullYear();
  let months = ev.getMonth() - dob.getMonth();
  let days = ev.getDate() - dob.getDate();

  if(days < 0){
    months--;
    const prevMonthDays = new Date(ev.getFullYear(), ev.getMonth(), 0).getDate();
    days += prevMonthDays;
  }
  if(months < 0){
    years--;
    months += 12;
  }

  const parts = [];
  if(years > 0) parts.push(years + (years === 1 ? ' year' : ' years'));
  if(months > 0) parts.push(months + (months === 1 ? ' month' : ' months'));
  if(days > 0 || parts.length === 0) parts.push(days + (days === 1 ? ' day' : ' days'));
  return parts.join(' ');
}

function refreshAllAges(){
  document.querySelectorAll('.milestone').forEach(updateAge);
}

function updateAge(el){
  const dateInput = el.querySelector('.m-date-input');
  const ageVal = el.querySelector('.m-age .val');
  const age = calcAge(dobInput.value, dateInput.value);
  ageVal.textContent = age || '—';
}

dobInput.addEventListener('change', () => { refreshAllAges(); saveData(); });
babyNameSpan.addEventListener('input', debouncedSave);
nicknameDiv.addEventListener('input', debouncedSave);

const ICON_CHOICES = ['flag', 'tooth', 'smile', 'cake', 'foot', 'hand', 'babyface'];

// close any open icon menu when clicking elsewhere
document.addEventListener('click', (e) => {
  document.querySelectorAll('.icon-menu.open').forEach(menu => {
    if(!menu.parentElement.contains(e.target)) menu.classList.remove('open');
  });
});

function setupIconPicker(el){
  const wrap = el.querySelector('.m-icon-wrap');
  const btn = wrap.querySelector('.m-icon');
  const menu = wrap.querySelector('.icon-menu');

  menu.innerHTML = ICON_CHOICES.map(key =>
    `<button type="button" data-icon="${key}" class="${el.dataset.icon === key ? 'active' : ''}">${icons[key]}</button>`
  ).join('');

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.icon-menu.open').forEach(m => { if(m !== menu) m.classList.remove('open'); });
    menu.classList.toggle('open');
  });

  menu.querySelectorAll('button').forEach(optBtn => {
    optBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = optBtn.dataset.icon;
      el.dataset.icon = key;
      btn.innerHTML = icons[key];
      menu.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.icon === key));
      menu.classList.remove('open');
      saveData();
    });
  });
}

function makeMilestone(item){
  const el = document.createElement('div');
  el.className = 'milestone';
  el.dataset.icon = item.icon;
  el.innerHTML = `
    <div class="m-head">
      <div class="m-icon-wrap">
        <button type="button" class="m-icon" title="Change icon">${icons[item.icon] || icons.flag}</button>
        <div class="icon-menu"></div>
      </div>
      <div class="m-title">
        <p class="name" contenteditable="true">${item.name}</p>
        <p class="avg">${item.avg || ''}</p>
      </div>
      <button class="m-delete" type="button" title="Delete this milestone">✕</button>
    </div>
    <div class="m-body">
      <div class="m-field">
        <label>Date</label>
        <input type="date" class="m-date-input">
      </div>
      <div class="m-field m-age">
        <label>Age at the time</label>
        <div class="val">—</div>
      </div>
    </div>
  `;

  if(item.date) el.querySelector('.m-date-input').value = item.date;

  el.querySelector('.name').addEventListener('input', debouncedSave);
  el.querySelector('.m-date-input').addEventListener('change', () => { updateAge(el); saveData(); });
  el.querySelector('.m-delete').addEventListener('click', () => { el.remove(); saveData(); });
  setupIconPicker(el);

  return el;
}

const defaultData = [
  {icon:'smile', name:'First smile', avg:'Average age ~6–8 weeks'},
  {icon:'laugh', name:'First laugh', avg:'Average age ~3–4 months'},
  {icon:'roll', name:'First roll over', avg:'Average age ~4–6 months'},
  {icon:'sit', name:'Sits up alone', avg:'Average age ~6 months'},
  {icon:'tooth', name:'First tooth', avg:'Average age ~6–10 months'},
  {icon:'crawl', name:'First crawl', avg:'Average age ~7–10 months'},
  {icon:'stand', name:'Stands holding on', avg:'Average age ~9–12 months'},
  {icon:'walk', name:'First steps', avg:'Average age ~11–14 months'},
  {icon:'word', name:'First word', avg:'Average age ~12 months'},
  {icon:'cake', name:'First birthday', avg:'A big milestone all its own'}
];

document.getElementById('addMilestoneBtn').addEventListener('click', () => {
  const el = makeMilestone({icon:'flag', name:'New milestone', avg:''});
  timeline.appendChild(el);
  el.querySelector('.name').focus();
  saveData();
});

// ---- initial render: restore saved data if present, otherwise defaults ----
(function init(){
  const saved = loadData();
  if(saved){
    babyNameSpan.textContent = saved.babyName || 'our little one';
    nicknameDiv.textContent = saved.nickname || 'Baby...';
    if(saved.dob) dobInput.value = saved.dob;
    const list = (saved.milestones && saved.milestones.length) ? saved.milestones : defaultData;
    list.forEach(item => timeline.appendChild(makeMilestone(item)));
  } else {
    defaultData.forEach(item => timeline.appendChild(makeMilestone(item)));
  }
  refreshAllAges();

  if(sheetUrl){
    setSyncConnectedUI(true);
    syncStatus.textContent = 'Syncing…'; syncStatus.className = 'sync-status';
    pullFromSheet().then(remote => {
      if(remote){
        applyRemoteData(remote);
        syncStatus.textContent = 'Connected ✓'; syncStatus.className = 'sync-status ok';
      } else {
        syncStatus.textContent = 'Could not reach Google Sheets — showing local data.';
        syncStatus.className = 'sync-status err';
      }
    });
  }
})();
</script>
